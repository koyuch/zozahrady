name: e2e

# Path-filtered: only runs when UI-affecting code changes. If this ever becomes a
# required branch check, skipped runs block merging — keep it non-required.
on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/blocks/**'
      - 'src/lib/**'
      - 'src/collections/**'
      - 'src/payload.config.ts'
      - 'src/seed.ts'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/blocks/**'
      - 'src/lib/**'
      - 'src/collections/**'
      - 'src/payload.config.ts'
      - 'src/seed.ts'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Ephemeral Postgres (matches local flake.nix postgresql_16); schema via
    # `pnpm payload migrate`, content via `pnpm seed` (frontend e2e expects it).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zozahrady
          POSTGRES_PASSWORD: zozahrady
          POSTGRES_DB: zozahrady_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zozahrady"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql://zozahrady:zozahrady@localhost:5432/zozahrady_test
      # Throwaway signing key for the ephemeral test database only — not a real secret.
      PAYLOAD_SECRET: ci-only-throwaway-jwt-key-0123456789abcdef
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CI: true

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm payload migrate

      - name: Seed content (e2e expects seeded pages)
        run: pnpm seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: e2e tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
